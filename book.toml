
[book]
title = "Rust Cookbook"
description = "Collection of useful Rust code examples"
authors = ["Rust Language Community"]
language = "en"
src = "src"

[rust]
edition = "2018"

[preprocessor.chips]
command = "cargo run --quiet --manifest-path packages/mdbook-chips/Cargo.toml --"
after = ["links"]

[output.html]
mathjax-support = false
# theme = "theme"
additional-css = ["theme/custom.css"]
additional-js = ["theme/crate-chips.js", "theme/command-k.js", "theme/quick-search.js", "theme/crate-index.js", "theme/nav-labels.js"]
git-repository-url = "https://github.com/rust-lang-nursery/rust-cookbook"
edit-url-template = "https://github.com/rust-lang-nursery/rust-cookbook/edit/master/{path}"

[output.html.fold]
enable = true
level = 1

[output.html.playground]
editable = false

[output.html.search]
limit-results = 20
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1
expand = true
heading-split-level = 2
