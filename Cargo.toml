[workspace]
members = [
  "crates/algorithms/*",
  "crates/cli/*",
  "crates/compression/*",
  "crates/concurrency/*",
  "crates/configuration/*",
  "crates/cryptography/*",
  "crates/database/rusqlite",
  "crates/data_structures/bitfield",
  "crates/datetime/*",
  "crates/development_tools/build_tools/*",
  "crates/development_tools/debugging/log4rs",
  "crates/development_tools/debugging/syslog",
  "crates/development_tools/debugging/tracing",
  "crates/encoding/*",
  "crates/file/*",
  "crates/multimedia/*",
  "crates/parsing/*",
  "crates/safety_critical/*",
  "crates/science/linear_algebra",
  "crates/wasm",
  "crates/web",
  "crates/web_scraping",
  "packages/mdbook-chips",
  "xtask",
]
exclude = [
  "crates/database/sea_orm",
  "crates/database/sqlx",
  "crates/multimedia/playback",
  "crates/web_leptos",
  "crates/web_leptos_hydrate",
  "crates/wasm_component_guest",
  "crates/wasm_component_host",
]

[workspace.package]
edition = "2024"
version = "1.1.0"
authors = [
  "Brian Anderson <banderson@mozilla.com>",
  "David Tolnay <dtolnay@gmail.com>",
  "Michał Budzyński <budziq@gmail.com>",
  "Brad Anderson <brad.anderson1995@gmail.com>",
  "David Harris <dhharris9@gmail.com>",
]
license = "MIT OR Apache-2.0"
publish = false

[workspace.metadata]
curator = "Andrew Gauger <andygauge@gmail.com>"

[package]
name = "rust-cookbook"
version = "1.1.0"
authors = [
  "Brian Anderson <banderson@mozilla.com>",
  "David Tolnay <dtolnay@gmail.com>",
  "Michał Budzyński <budziq@gmail.com>",
  "Brad Anderson <brad.anderson1995@gmail.com>",
  "David Harris <dhharris9@gmail.com>",
]
edition = "2018"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"

[package.metadata]
curator = "Andrew Gauger <andygauge@gmail.com>"

[features]
default = []

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = "0.3"

# NOTE: These dependencies add dependencies to the rust playground (play.rust-lang.org).
# Be wary removing or changing these without considering this fact.
# Entries marked `optional` exist only so the playground offers the crate; recipes that use
# them live in standalone crates under crates/, and nothing here compiles them by default.
# See https://github.com/rust-lang/rust-playground/blob/f8d7de52a3c139a0df4fe116bbbff19c30668c99/top-crates/src/lib.rs#L134-L161
[dependencies]
anyhow = "1.0"
approx = { version = "0.5", optional = true }
base64 = { version = "0.23", optional = true }
bitflags = { version = "2", optional = true }
cc = { version = "1", optional = true }
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
crossbeam = "0.8"
crossbeam-channel = "0.5"
csv = "1.0"
data-encoding = "2.1.0"
env_logger = "0.11.3"
flate2 = "1.0"
glob = "0.3"
image = { version = "0.25", optional = true }
log = "0.4"
memmap2 = { version = "0.9", optional = true }
mime = "0.3"
nalgebra = { version = "0.35", optional = true }
ndarray = { version = "0.17", optional = true }
nu-ansi-term = { version = "0.50", optional = true }
num = "0.4"
num_cpus = "1.16"
percent-encoding = "2.3"
postgres = "0.19.7"
rand = { version = "0.10", optional = true }
rand_distr = { version = "0.6", optional = true }
rayon = "1.10"
regex = "1.11"
reqwest = { version = "0.13", optional = true }
ring = "0.17"
rusqlite = { version = "0.41", optional = true }
same-file = "1.0"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syslog = { version = "7.0", optional = true }
tar = "0.4"
tempfile = "3.14"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = { version = "1.1", optional = true }
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-segmentation = "1.2.1"
url = "2.5"
walkdir = "2.5"

# `no-panic` proves functions are panic-free via a linker trick that only
# works when the compiler actually optimizes the code away; the default dev
# profile (opt-level 0) leaves the panic paths in, so debug builds/tests of
# this crate fail to link. Opt it into release-level optimizations even in
# dev/test builds.
[profile.dev.package.no-panic-example]
opt-level = 2

[build-dependencies]
skeptic = "0.14.2"
walkdir = "2.5"

[dev-dependencies]
skeptic = "0.14.2"
walkdir = "2.5"

[lints.clippy]
# Warn on the default clippy groups, but let cookbook examples keep the
# idioms they deliberately demonstrate.
all = { level = "warn", priority = -1 }
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
todo = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
