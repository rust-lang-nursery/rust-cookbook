[package]
name = "playground-starters"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# One starter per crate the cookbook lists for the Rust Playground (the optional entries in the root
# Cargo.toml). `mdbook-chips` reads src/bin/<crate>.rs and links the crate's play icon to the
# Playground with that code pre-filled; compiling them here keeps the starters working.
[dependencies]
anyhow = "1.0"
approx = "0.5"
argon2 = "0.6"
base64 = "0.23"
bitflags = "2"
bzip2 = "0.6"
cc = "1"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
config = "0.15"
confy = "2"
crossbeam = "0.8"
crossbeam-channel = "0.5"
csv = "1.0"
data-encoding = "2.1"
env_logger = "0.11"
figment = "0.10"
flate2 = "1.0"
glob = "0.3"
image = "0.25"
kamadak-exif = "0.6"
log = "0.4"
log4rs = "1.4"
memmap2 = "0.9"
mime = "0.3"
nalgebra = "0.35"
ndarray = "0.17"
nom = "8"
nu-ansi-term = "0.50"
num = "0.4"
num_cpus = "1.16"
pbkdf2 = { version = "0.13", features = ["getrandom", "phc"] }
percent-encoding = "2.3"
pest = "2.7"
pest_derive = "2.7"
postgres = "0.19"
rand = "0.10"
rand_distr = "0.6"
rayon = "1.10"
regex = "1.11"
reqwest = "0.13"
ring = "0.17"
rusqlite = { version = "0.41", features = ["bundled"] }
same-file = "1.0"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syslog = "7.0"
tar = "0.4"
tempfile = "3.14"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1.2"
url = "2.5"
walkdir = "2.5"
which = "8"
