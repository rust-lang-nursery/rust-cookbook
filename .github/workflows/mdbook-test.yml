name: Test Rust Project

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: "true"
          toolchain: stable

      # skeptic's `binary-cache` feature keeps compiled snippets in
      # target/debug/.skeptic-bin. The Rust cache above prunes unknown files from
      # target/, so restore it separately. Entries are keyed by snippet, compiler
      # and linked libraries, so a stale entry is simply a miss.
      - name: Restore skeptic binary cache
        uses: actions/cache@v4
        with:
          path: target/debug/.skeptic-bin
          key: skeptic-bin-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'rust-toolchain*') }}-${{ github.sha }}
          restore-keys: |
            skeptic-bin-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'rust-toolchain*') }}-

      - name: Run tests
        id: cargo_test
        run: |
          cargo test --test skeptic -- --test-threads=1

      - name: Test Results
        if: always()
        run: |
          if [ "${{ steps.cargo_test.outcome }}" == "success" ]; then
            echo "✅ All tests passed!"
          else
            echo "❌ Some tests failed. Check the logs above for details."
            exit 1
          fi
  check-workspace:
    # this job incrementally replaces the skeptic tests above as we convert examples to be written
    # as workspace crates rather than inline in the mdbook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: cargo check
        id: cargo_check
        run: cargo check --workspace
      - name: Check Results
        if: always()
        run: |
          if [ "${{ steps.cargo_check.outcome }}" == "success" ]; then
            echo "✅ Workspace check passed!"
          else
            echo "❌ Workspace check failed. Check the logs above for details."
            exit 1
          fi
      - name: cargo test workspace crates
        id: cargo_test_workspace
        # rust-cookbook is excluded: its tests are the skeptic-generated doc tests
        # already covered by the `test` job above.
        run: cargo test --workspace --exclude rust-cookbook
      - name: Workspace Test Results
        if: always()
        run: |
          if [ "${{ steps.cargo_test_workspace.outcome }}" == "success" ]; then
            echo "✅ Workspace crate tests passed!"
          else
            echo "❌ Workspace crate tests failed. Check the logs above for details."
            exit 1
          fi
